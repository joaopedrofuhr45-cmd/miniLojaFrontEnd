<div class="head"><h2 class="section-title">{{ title() }}</h2><a class="all" routerLink="/catalogo" [queryParams]="query()"><ui-swap text="Ver todas" hover="Explorar" /> <span class="arr">›</span></a></div>
<div class="grid">
  @if (products(); as list) {
    @for (p of list; track p.id) { <ui-product-card [product]="p" (add)="add.emit($event)" /> }
  } @else {
    @for (i of [1, 2, 3, 4]; track i) { <div class="skeleton" style="height:390px"></div> }
  }
</div>
