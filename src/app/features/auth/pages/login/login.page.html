<div class="container wrap">
  <span class="blob b1" aria-hidden="true"></span>
  <span class="blob b2" aria-hidden="true"></span>
  <div class="stack">
  <a class="back" routerLink="/"><span class="arrow" aria-hidden="true">←</span><ui-swap text="Voltar para a home" hover="Ir para a loja" /></a>
  <section class="card" data-no-reveal aria-labelledby="t-login">
    <nav class="tabs" aria-label="Acesso à conta">
      <a routerLink="/entrar" queryParamsHandling="preserve" class="on" aria-current="page">Entrar</a>
      <a routerLink="/cadastrar" queryParamsHandling="preserve">Criar conta</a>
    </nav>
    <h1 id="t-login">Que bom te ver de novo</h1>
    <p class="sub">Entre para acompanhar pedidos e comprar mais rápido.</p>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (error()) { <p class="alert error" role="alert">{{ error() }}</p> }
      <div class="field"><label for="l-email">E-mail</label>
        <input id="l-email" type="email" formControlName="email" autocomplete="email" placeholder="voce@email.com" />
        @if (err('email'); as m) { <span class="error">{{ m }}</span> }</div>
      <div class="field"><label for="l-pass">Senha</label>
        <input id="l-pass" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
        @if (err('password'); as m) { <span class="error">{{ m }}</span> }</div>
      <div class="between">
        <label class="check"><input type="checkbox" formControlName="remember" /> Manter conectado</label>
        <a href="#" class="forgot" (click)="$event.preventDefault()">Esqueci a senha</a>
      </div>
      <button uiButton variant="cta" size="lg" [block]="true" type="submit" [disabled]="busy()" hoverText="Bora comprar">{{ busy() ? 'Entrando…' : 'Entrar' }}</button>
      <p class="note"><ui-icon name="lock" [size]="14" /> Seus dados ficam protegidos</p>
    </form>
  </section>
  </div>
</div>
